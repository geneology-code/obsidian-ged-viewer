# Эвристики генеалогического поиска по Российской империи
# Развилка по сословиям на основе полей GEDCOM: OCCU, TITL, RELI
#
# Логика определения сословия:
#   - title_include: дворянские чины, духовные саны → дворянство / духовенство
#   - occu_include: профессия → купечество / мещанство / казачество / духовенство
#   - reli_include: вероисповедание (резерв для будущих конфессиональных развилок)
#   - По умолчанию (has_occu: false и has_title: false) → крестьянство

rules:
  - when:
      place_includes_any: ['Россия', 'Российская', 'РСФСР', 'Russia', 'USSR', 'Soviet']
    rules:
      - when:
          alive_in_range: [862, 1917]
        rules:

          # =====================================================================
          # ОБЩИЕ ДОКУМЕНТЫ (применимы ко всем сословиям)
          # =====================================================================

          # Церковные документы (православные)
          - when:
              alive_in_range: [1722, 1917]
            source: "Метрические книги"
          - when:
              alive_in_range: [1737, 1917]
            source: "Исповедные росписи"
          - when:
              alive_in_range: [1722, 1917]
            source: "Брачные обыски (предбрачные расследования)"

          # Всероссийская перепись
          - when:
              alive_in: 1897
            source: "I Всероссийская перепись населения (1897)"

          # =====================================================================
          # ДВОРЯНСТВО
          # Признаки: TITL содержит дворянский титул/чин;
          #           OCCU указывает на офицерскую/чиновничью службу
          # =====================================================================
          - when:
              any:
                - title_include: 'дворян'
                - title_include: 'граф'
                - title_include: 'княз'
                - title_include: 'барон'
                - title_include: 'статский'
                - title_include: 'коллежский'
                - title_include: 'надворный'
                - title_include: 'титулярный'
                - title_include: 'губернский секретарь'
                - title_include: 'регистратор'
                - title_include: 'действительный'
                - title_include: 'тайный советник'
                - title_include: 'камер-юнкер'
                - title_include: 'камергер'
                - occu_include: 'офицер'
                - occu_include: 'поручик'
                - occu_include: 'подпоручик'
                - occu_include: 'капитан'
                - occu_include: 'майор'
                - occu_include: 'полковник'
                - occu_include: 'генерал'
                - occu_include: 'ротмистр'
                - occu_include: 'корнет'
                - occu_include: 'мичман'
                - occu_include: 'чиновник'
                - occu_include: 'помещик'
            rules:
              - when:
                  alive_in_range: [1722, 1917]
                source: "Дела Департамента герольдии Сената (о причислении к дворянству, дипломы)"
              - when:
                  alive_in_range: [1785, 1917]
                source: "Дворянские родословные книги губернских ДДС (6 частей)"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Жалованные грамоты и патенты на чины"
              - when:
                  alive_in_range: [1797, 1917]
                source: "Общий гербовник дворянских родов Российской империи"
              - when:
                  alive_in_range: [1764, 1917]
                source: "Формулярные (послужные) списки чиновников и офицеров"
              - when:
                  alive_in_range: [1785, 1917]
                source: "Журналы дворянских депутатских собраний, списки уездных предводителей"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Дела дворянских опек (об имуществе, наследстве, малолетних)"
              - when:
                  all:
                    - sex: M
                    - alive_in_range: [1875, 1917]
                source: "Призывные списки (с льготами по образованию и сословию)"

          # =====================================================================
          # ДУХОВЕНСТВО
          # Признаки: TITL/OCCU содержат духовный сан или церковную должность
          # =====================================================================
          - when:
              any:
                - title_include: 'священник'
                - title_include: 'иерей'
                - title_include: 'протоиерей'
                - title_include: 'диакон'
                - title_include: 'дьякон'
                - title_include: 'архиерей'
                - title_include: 'епископ'
                - title_include: 'архиепископ'
                - title_include: 'митрополит'
                - title_include: 'игумен'
                - title_include: 'архимандрит'
                - occu_include: 'священник'
                - occu_include: 'иерей'
                - occu_include: 'диакон'
                - occu_include: 'дьякон'
                - occu_include: 'дьячок'
                - occu_include: 'пономарь'
                - occu_include: 'псаломщик'
                - occu_include: 'причетник'
                - occu_include: 'просфорня'
                - occu_include: 'монах'
                - occu_include: 'монахиня'
                - occu_include: 'инок'
                - occu_include: 'послушник'
            rules:
              - when:
                  alive_in_range: [1769, 1917]
                source: "Клировые ведомости приходов (состав причта, семьи, образование)"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Ставленнические дела (о рукоположении в сан)"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Послужные списки священно- и церковнослужителей"
              - when:
                  alive_in_range: [1860, 1917]
                source: "Епархиальные ведомости (некрологи, перемещения, награждения)"
              - when:
                  alive_in_range: [1721, 1917]
                source: "Документы духовных правлений и консисторий"
              - when:
                  alive_in_range: [1721, 1917]
                source: "Списки воспитанников духовных училищ, семинарий, академий"
              - when:
                  all:
                    - sex: M
                    - alive_in_range: [1875, 1917]
                source: "Призывные списки (с правом отсрочки/освобождения для духовенства)"

          # =====================================================================
          # КУПЕЧЕСТВО
          # Признаки: OCCU/TITL — купец, гильдия, почётный гражданин
          # =====================================================================
          - when:
              any:
                - occu_include: 'купец'
                - occu_include: 'купчиха'
                - occu_include: 'гильдии'
                - occu_include: 'гильдия'
                - title_include: 'купец'
                - title_include: 'почётный гражданин'
                - title_include: 'почетный гражданин'
            rules:
              - when:
                  alive_in_range: [1775, 1917]
                source: "Объявления купеческих капиталов (ежегодные ведомости гильдий)"
              - when:
                  alive_in_range: [1775, 1917]
                source: "Гильдейские списки (1-я, 2-я, 3-я гильдии)"
              - when:
                  alive_in_range: [1785, 1917]
                source: "Городские обывательские книги (6 частей)"
              - when:
                  alive_in_range: [1832, 1917]
                source: "Списки потомственных и личных почётных граждан"
              - when:
                  alive_in_range: [1775, 1917]
                source: "Документы городских магистратов, ратуш, купеческих управ"
              # Ревизские сказки (купцы 3-й гильдии и часть купцов учитывались)
              - when:
                  alive_in_range: [1857, 1859]
                source: "10-я ревизская сказка (1857-1859) — купеческие"
              - when:
                  alive_in: 1850
                source: "9-я ревизская сказка (1850) — купеческие"
              - when:
                  alive_in_range: [1833, 1835]
                source: "8-я ревизская сказка (1833-1835) — купеческие"
              - when:
                  alive_in_range: [1816, 1825]
                source: "7-я ревизская сказка (1816-1825) — купеческие"
              - when:
                  alive_in_range: [1811, 1812]
                source: "6-я ревизская сказка (1811-1812) — купеческие"
              - when:
                  alive_in_range: [1795, 1808]
                source: "5-я ревизская сказка (1795-1808) — купеческие"
              - when:
                  alive_in_range: [1782, 1787]
                source: "4-я ревизская сказка (1782-1787)"
              - when:
                  alive_in_range: [1761, 1767]
                source: "3-я ревизская сказка (1761-1767)"
              - when:
                  alive_in_range: [1744, 1747]
                source: "2-я ревизская сказка (1744-1747)"
              - when:
                  alive_in_range: [1719, 1727]
                source: "1-я ревизская сказка (1719-1727)"
              - when:
                  sex: M
                rules:
                  - when:
                      alive_in_range: [1700, 1874]
                    source: "Рекрутские списки / рекрутские квитанции (купцы часто откупались)"
                  - when:
                      alive_in_range: [1875, 1917]
                    source: "Призывные списки"

          # =====================================================================
          # МЕЩАНСТВО
          # Признаки: OCCU/TITL — мещанин, ремесленник, цеховой
          # =====================================================================
          - when:
              any:
                - occu_include: 'мещан'
                - occu_include: 'ремесленник'
                - occu_include: 'цеховой'
                - occu_include: 'цеховая'
                - occu_include: 'портной'
                - occu_include: 'сапожник'
                - occu_include: 'кузнец'
                - occu_include: 'столяр'
                - occu_include: 'плотник'
                - occu_include: 'каменщик'
                - title_include: 'мещан'
            rules:
              - when:
                  alive_in_range: [1785, 1917]
                source: "Городские обывательские книги (6 частей)"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Цеховые росписи и книги (для ремесленников)"
              - when:
                  alive_in_range: [1775, 1917]
                source: "Документы городских магистратов, ратуш, мещанских управ, городских дум"
              - when:
                  alive_in_range: [1874, 1917]
                source: "Посемейные списки (по воинской повинности)"
              - when:
                  alive_in_range: [1832, 1917]
                source: "Списки личных почётных граждан (для выслужившихся)"
              # Ревизские сказки
              - when:
                  alive_in_range: [1857, 1859]
                source: "10-я ревизская сказка (1857-1859)"
              - when:
                  alive_in: 1850
                source: "9-я ревизская сказка (1850)"
              - when:
                  alive_in_range: [1833, 1835]
                source: "8-я ревизская сказка (1833-1835)"
              - when:
                  alive_in_range: [1816, 1825]
                source: "7-я ревизская сказка (1816-1825)"
              - when:
                  alive_in_range: [1811, 1812]
                source: "6-я ревизская сказка (1811-1812)"
              - when:
                  alive_in_range: [1795, 1808]
                source: "5-я ревизская сказка (1795-1808)"
              - when:
                  alive_in_range: [1782, 1787]
                source: "4-я ревизская сказка (1782-1787)"
              - when:
                  alive_in_range: [1761, 1767]
                source: "3-я ревизская сказка (1761-1767)"
              - when:
                  alive_in_range: [1744, 1747]
                source: "2-я ревизская сказка (1744-1747)"
              - when:
                  alive_in_range: [1719, 1727]
                source: "1-я ревизская сказка (1719-1727)"
              - when:
                  sex: M
                rules:
                  - when:
                      alive_in_range: [1700, 1874]
                    source: "Рекрутские списки"
                  - when:
                      alive_in_range: [1875, 1917]
                    source: "Призывные списки"

          # =====================================================================
          # КАЗАЧЕСТВО
          # Признаки: OCCU/TITL — казак, атаман, есаул, хорунжий и т.п.
          # =====================================================================
          - when:
              any:
                - occu_include: 'казак'
                - occu_include: 'казачка'
                - occu_include: 'атаман'
                - occu_include: 'есаул'
                - occu_include: 'хорунжий'
                - occu_include: 'сотник'
                - occu_include: 'урядник'
                - title_include: 'казак'
                - title_include: 'атаман'
            rules:
              - when:
                  alive_in_range: [1722, 1917]
                source: "Войсковые и станичные документы (Войска Донского, Кубанского, Терского, Уральского, Оренбургского, Сибирского, Забайкальского и др.)"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Посемейные списки казаков (станичные)"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Формулярные/послужные списки казачьих офицеров и нижних чинов"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Документы войсковых правлений и канцелярий наказных атаманов"
              - when:
                  alive_in_range: [1722, 1917]
                source: "Списки служилых казаков, ведомости о выходящих на службу"
              # Казаки не подлежали рекрутской/всесословной воинской повинности —
              # учёт через войсковые/станичные списки выше

          # =====================================================================
          # КРЕСТЬЯНСТВО (default)
          # Срабатывает при явном указании "крестьянин/крестьянка" в OCCU/TITL
          # ИЛИ когда оба поля пусты (типичный житель РИ)
          # =====================================================================
          - when:
              any:
                - occu_include: 'крестьян'
                - occu_include: 'землепашец'
                - occu_include: 'пахарь'
                - occu_include: 'батрак'
                - title_include: 'крестьян'
                - all:
                    - has_occu: false
                    - has_title: false
            rules:
              # Документы крестьянской реформы и общин
              - when:
                  alive_in_range: [1861, 1880]
                source: "Уставные грамоты (1861-1863) — для бывших помещичьих крестьян"
              - when:
                  alive_in_range: [1862, 1907]
                source: "Выкупные дела (для бывших помещичьих)"
              - when:
                  alive_in_range: [1838, 1866]
                source: "Документы Министерства государственных имуществ (для государственных крестьян)"
              - when:
                  alive_in_range: [1797, 1917]
                source: "Документы Удельного ведомства (для удельных крестьян)"
              - when:
                  alive_in_range: [1797, 1917]
                source: "Документы волостных правлений и сельских обществ (приговоры, окладные книги)"
              - when:
                  alive_in_range: [1874, 1917]
                source: "Посемейные списки (по воинской повинности, ежегодные)"
              - when:
                  alive_in_range: [1880, 1917]
                source: "Подворные переписи земств"
              - when:
                  alive_in_range: [1916, 1917]
                source: "Сельскохозяйственная перепись 1916-1917 гг."
              # Ревизские сказки
              - when:
                  alive_in_range: [1857, 1859]
                source: "10-я ревизская сказка (1857-1859)"
              - when:
                  alive_in: 1850
                source: "9-я ревизская сказка (1850)"
              - when:
                  alive_in_range: [1833, 1835]
                source: "8-я ревизская сказка (1833-1835)"
              - when:
                  alive_in_range: [1816, 1825]
                source: "7-я ревизская сказка (1816-1825)"
              - when:
                  alive_in_range: [1811, 1812]
                source: "6-я ревизская сказка (1811-1812)"
              - when:
                  alive_in_range: [1795, 1808]
                source: "5-я ревизская сказка (1795-1808)"
              - when:
                  alive_in_range: [1782, 1787]
                source: "4-я ревизская сказка (1782-1787)"
              - when:
                  alive_in_range: [1761, 1767]
                source: "3-я ревизская сказка (1761-1767)"
              - when:
                  alive_in_range: [1744, 1747]
                source: "2-я ревизская сказка (1744-1747)"
              - when:
                  alive_in_range: [1719, 1727]
                source: "1-я ревизская сказка (1719-1727)"
              # Военные документы
              - when:
                  sex: M
                rules:
                  - when:
                      alive_in_range: [1700, 1874]
                    source: "Рекрутские списки"
                  - when:
                      alive_in_range: [1875, 1917]
                    source: "Призывные списки"